<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Two-Headed Commander</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GitHub Pages can't find a path (e.g. /admin, /how-to-play),
      // it serves this 404.html. We encode the intended path into the
      // query string and redirect to index.html, which then restores it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
